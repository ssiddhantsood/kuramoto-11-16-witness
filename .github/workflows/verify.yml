name: Verify witnesses

on:
  push:
  pull_request:

jobs:
  certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verifier dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify the N=80,002 record with mpmath intervals
        run: python records/n80002/verify.py --out /tmp/n80002-mpmath.json
      - name: Verify the N=80,002 record independently with Arb
        run: python records/n80002/verify_arb.py --out /tmp/n80002-arb.json
      - name: Verify the original N=460,800 Arb certificate
        run: python formal/verify.py
